server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Frontend estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o API Gateway — elimina CORS e isola o frontend
    location /api/ {
        proxy_pass http://api-gateway:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /healthz {
        proxy_pass http://api-gateway:8000/healthz;
    }

    # Dynatrace RUM — proxy do script JS (evita CORS ao carregar de rio76974.live.dynatrace.com)
    location ~* ^/ruxitagentjs {
        proxy_pass https://rio76974.live.dynatrace.com;
        proxy_set_header Host rio76974.live.dynatrace.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Dynatrace RUM beacons — proxy para o cluster DT (evita 405 no nginx estático)
    location /dynaTraceMonitor {
        proxy_pass https://rio76974.live.dynatrace.com/dynaTraceMonitor;
        proxy_set_header Host rio76974.live.dynatrace.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rb_bf71124pqh {
        proxy_pass https://rio76974.live.dynatrace.com/rb_bf71124pqh;
        proxy_set_header Host rio76974.live.dynatrace.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/html application/javascript application/json;
}
