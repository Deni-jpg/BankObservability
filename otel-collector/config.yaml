# OpenTelemetry Collector - Banco Atlântico Demo
# Pipeline: Serviços Python → Collector → Dynatrace (OTLP/HTTP)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

  resource:
    attributes:
      - key: environment
        value: "demo"
        action: upsert
      - key: service.namespace
        value: "banco-atlantico"
        action: upsert

  # Dynatrace exige métricas em Delta — este processor converte automaticamente
  cumulativetodelta: {}

exporters:
  # Dynatrace ingere OTLP natively - apenas aponte e autentique
  otlphttp/dynatrace:
    endpoint: "${env:DT_TENANT}/api/v2/otlp"
    headers:
      Authorization: "Api-Token ${env:DT_TOKEN}"

  # Logs locais do próprio collector (apenas warnings)
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlphttp/dynatrace, debug]
    metrics:
      receivers: [otlp]
      processors: [cumulativetodelta, batch, resource]
      exporters: [otlphttp/dynatrace]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/dynatrace]

  telemetry:
    logs:
      level: "warn"
